name: Input verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  entradas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install geospatial system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libudunits2-dev libgdal-dev libgeos-dev libproj-dev
      - name: Install check dependencies
        run: Rscript instalar.R
      - run: Rscript reproduzir.R codigo
      - run: Rscript reproduzir.R verificar
      - run: Rscript reproduzir.R preparar
      - run: Rscript reproduzir.R geometria
